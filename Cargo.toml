[workspace]
resolver = "2"
members = [
    "crates/fabric-core",
    "crates/fabric-cli",
]
default-members = ["crates/fabric-core", "crates/fabric-cli"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
license-file = "LICENSE"
authors = ["Rightsholder"]
repository = "https://github.com/theworker02/cross-region-private-networking"

[workspace.dependencies]
fabric-core = { path = "crates/fabric-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "serde"] }
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = "0.13"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
